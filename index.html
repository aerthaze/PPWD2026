<!DOCTYPE html>
<html lang="en">
<head>
    <title>tebakangka_1035</title>
    <style>
        body {
            font-family: Helvetica, sans-serif;
            text-align: center;
        }
        header {
        display: flex;
        background-color: rgb(23, 23, 168);
        box-shadow: white;
        position: sticky; z-index: 100;
        color: white;
        justify-content: center;
        align-items: center;
        }

        footer {
        display: flex;
        background-color: rgb(23, 23, 168);
        box-shadow: white;
        position: sticky; z-index: 100;
        color: white;
        justify-content: center;
        align-items: center;

        bottom: 0;
        }

        .header__inner {
        display: flex; align-items: center; justify-content: space-between;
        }
        .message.hint {
            color: #ff9800;
        }

        .message.success {
            color: #4caf50;
        }

        .message.error {
            color: #f44336;
        }
        #hasil {
            font-size: 1.4em;
            font-weight: bold;
            color: #0070c0;
            margin-top: 15px;
        }
        .containermain {
            background-color: #f0f0f0;
            padding: 20px;
            margin-top: 20px;
            margin-left: 300px;
            margin-right: 300px;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="container_header">
            <h1>Tebak Angka</h1>
            <p>Muhammad Farras Haidar Revanezka - H1101251035</p>
        </div>
    </header>

    <main class="containermain">
        <h2>Tebak Angka</h2>
        <p>1-100</p>
        <input type="number" id="inputangka" placeholder="1-100">
        <button id="tebak">Tebak</button>
        <button id="reset">Reset</button>
        <div id="hasil"></div>
        <div id="clue"></div>
        <div id="counter">Sisa Percobaan: 5</div>
    </main>

    <footer>
        <p>ini footer</p>
    </footer>
    <script>
        const tebakinput = document.getElementById('inputangka');
        const tomboltebak = document.getElementById('tebak');
        const petunjuk = document.getElementById('clue');
        const counterpercobaan = document.getElementById('counter');
        const tombolreset = document.getElementById('reset');   
        let targetnomor;
        let sisapercobaan;

        function gametebakangka() {
             targetnomor = Math.floor(Math.random() * 100) + 1;
             sisapercobaan = 5; 
             tebakinput.value = '';
            tebakinput.disabled = false;
             tomboltebak.disabled = false;
             tombolreset.style.display = 'none';
             counterpercobaan.textContent = '';
             counterpercobaan.className = 'counter';
             updatecounterpercobaan();

          }

        function updatecounterpercobaan() {
                counterpercobaan.textContent = `Sisa Percobaan: ${sisapercobaan}`;
        }

        function endGame() {
                tebakinput.disabled = true;
                tomboltebak.disabled = true;
                tombolreset.style.display = 'inline-block';
        }

        // fungsi & logika tombol tebak
        tomboltebak.addEventListener('click', function () {
            const nilaitebakan = tebakinput.value;
            const tebakan = parseInt(nilaitebakan);
            // logika petunjuk 
            if (nilaitebakan === '' || isNaN(tebakan) || tebakan < 1 || tebakan > 100) {
                petunjuk.textContent = "Masukkan angka valid (1-100)!";
                petunjuk.className = 'message error';
                return;
            }

            // pengurangan counter percobaan
            sisapercobaan--;
            updatecounterpercobaan();

            // logika pengecekkan angka
            if (tebakan === targetnomor) {
                petunjuk.textContent = `Selamat! Angkanya adalah ${targetnomor}.`;
                petunjuk.className = 'message success';
                endGame();
            } else if (sisapercobaan === 0) {
                petunjuk.textContent = `Game Over! Angkanya adalah ${targetnomor}.`;
                petunjuk.className = 'message error';
                endGame();
            } else {
                if (tebakan< targetnomor) {
                    petunjuk.textContent = "Terlalu kecil!";
                    petunjuk.className = 'message hint';
                } else {
                    petunjuk.textContent = "Terlalu besar!";
                    petunjuk.className = 'message hint';
                }
            }

            tebakinput.value = '';
        });

        tombolreset.addEventListener('click', gametebakangka);
        gametebakangka();
    </script>
</body>
</html>
