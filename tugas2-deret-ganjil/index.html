<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Tugas 2 - Deret Bilangan Ganjil</title>
<style>
  body { font-family: Arial; text-align: center; padding: 40px; background: #f0f2f5; }
  .container { background: white; padding: 30px; border-radius: 12px; max-width: 450px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
  input { padding: 10px; width: 80%; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; }
  button { padding: 10px 25px; background: #2c3e50; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
  button:hover { background: #1a252f; }
  .hasil { margin-top: 20px; padding: 15px; background: #eaf2f8; border-radius: 6px; word-wrap: break-word; }
  .error { background: #fdecea; color: #c0392b; }
</style>
</head>
<body>
<p><a href="../index.html">&larr; Kembali ke Portal</a></p>
<div class="container">
  <h2>🔢 Deret Bilangan Ganjil</h2>
  <input type="number" id="inputN" placeholder="Masukkan nilai N">
  <br>
  <button onclick="tampilkanDeret()">Tampilkan</button>
  <div class="hasil" id="hasil">
    <p>⬆️ Masukkan nilai N lalu klik tombol Tampilkan</p>
  </div>
</div>

<script>
function tampilkanDeret() {
  // Ambil nilai input dengan parseFloat, seperti contoh di modul
  let n = parseFloat(document.getElementById("inputN").value);
  let hasilDiv = document.getElementById("hasil");

  // Validasi: harus berupa angka
  if (isNaN(n)) {
    hasilDiv.className = "hasil error";
    hasilDiv.innerHTML = "❌ Masukkan angka yang valid!";
    return;
  }

  // Validasi N harus positif (sesuai requirement)
  if (n < 1) {
    hasilDiv.className = "hasil error";
    hasilDiv.innerHTML = "Masukkan angka positif!";
    return;
  }

  // Gunakan perulangan for + operator modulus (%) untuk cek bilangan ganjil
  // Sama seperti pola loop di modul: gabungkan string langsung dengan operator +
  let teksDeret = "";
  for (let i = 1; i <= n; i++) {
    if (i % 2 !== 0) {
      if (teksDeret === "") {
        teksDeret = teksDeret + i;
      } else {
        teksDeret = teksDeret + ", " + i;
      }
    }
  }

  hasilDiv.className = "hasil";
  hasilDiv.innerHTML =
    "📋 Deret bilangan ganjil dari 1 sampai " + n + ":<br>" +
    "<strong>" + teksDeret + "</strong>";
}
</script>
</body>
</html>
